# Raises the kernel's inotify limits on every node.
#
# Following a container log (`kubectl logs -f`, the OOPS log panels, log agents that use the
# kubelet API) costs the kubelet one inotify instance for as long as the follow is open, and the
# instances are counted per uid, so every root process on the node — including every container
# running as root, code-server IDEs and file-watching agents first among them — draws on the same
# pool as the kubelet. The default `fs.inotify.max_user_instances` is 128; once it is spent the
# kubelet answers every log request with `failed to create fsnotify watcher: too many open files`.
#
# The sysctls are not namespaced, so a privileged init container writing them changes the node's
# kernel, and a DaemonSet re-applies them after every reboot. Apply with:
#
#   kubectl apply -f resources/inotify-limits.yaml
#
# and check a node with:
#
#   kubectl exec -n kube-system ds/inotify-limits -- sysctl fs.inotify.max_user_instances
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: inotify-limits
  namespace: kube-system
  labels:
    app: inotify-limits
spec:
  selector:
    matchLabels:
      app: inotify-limits
  template:
    metadata:
      labels:
        app: inotify-limits
    spec:
      tolerations:
        # Every node runs a kubelet that follows logs, control-plane and tainted nodes included.
        - operator: Exists
      priorityClassName: system-node-critical
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              raise() {
                current=$(sysctl -n "$1")
                if [ "$current" -lt "$2" ]; then
                  sysctl -w "$1=$2"
                else
                  echo "$1 = $current already >= $2, left as is"
                fi
              }
              raise fs.inotify.max_user_instances 8192
              raise fs.inotify.max_user_watches 1048576
          securityContext:
            privileged: true
      containers:
        # Keeps the pod alive so the DaemonSet does not restart the init container in a loop; the
        # exec check in the header runs against this container.
        - name: hold
          image: busybox:1.36
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              memory: 16Mi
